# Crop profiles. Each crop is a block of lines sharing an id (the part before the first dot).
#
#   <id>.name=<Crop Name>                      required
#   <id>.<sensor>.min / .max=<number>          acceptable range; leave out a bound or a sensor to skip that check
#   <id>.<sensor>.<low|high>.water=<litres>    optional water used when that alert fires
#   <id>.<sensor>.<low|high>.energy=<kWh>      optional energy used when that alert fires
#
# Sensors: temperature (C), humidity (%), soil (%), light (lux), nutrient (%)
# Light and nutrient limits for all crops live in facility.properties.
#
# To ADD a crop: copy a block and change the values. To REMOVE a crop: delete its block.
# No Java code changes are needed either way.
#
# The six legacy crops below reproduce exactly the checks hard-coded in the old SVFRMS.processSensor().

