# Facility-wide rules that apply to every chamber, whatever the crop.

# Alert thresholds (legacy: light < 500 lux, nutrient < 40 %)
threshold.light.min=500
threshold.nutrient.min=40

# Which device responds to which alert: response.<sensor>.<high|low>=<device name>
response.temperature.high=Cooling Fan
response.humidity.high=Dehumidifier
response.humidity.low=Humidifier
response.soil.low=Water Pump
response.light.low=Grow Light
response.nutrient.low=Nutrient Injector

# Devices from the brief that the legacy system never triggered. Uncomment to enable them.
# Warning: enabling these changes the program output compared to the legacy system.
# response.temperature.low=Heating Unit
# response.light.high=Shade Controller
